services:
  db:
    image: postgres:16-alpine
    container_name: mrrwanda-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrrwanda
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mrrwanda_dev
    ports:
      # Host 5433 -> container 5432, since a local Postgres is already on 5432.
      - "5433:5432"
    volumes:
      - mrrwanda_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrrwanda -d mrrwanda_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: mrrwanda-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mrrwanda
      MINIO_ROOT_PASSWORD: devpassword123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API — what the app's uploads talk to
      - "9001:9001" # Web console — http://localhost:9001
    volumes:
      - mrrwanda_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mrrwanda_db_data:
  mrrwanda_minio_data:
